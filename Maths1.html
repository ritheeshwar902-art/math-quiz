<!DOCTYPE html>
<html>

<head>

    <title>Shadow Math Quiz</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            min-height:100vh;
            background:linear-gradient(135deg,#050816,#111827,#1e293b);
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            font-size:45px;
            color:cyan;
            text-shadow:0 0 20px cyan;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,255,255,0.4);
        }

        #ageSection{
            text-align:center;
            margin-bottom:30px;
        }

        input[type="number"]{
            padding:12px;
            width:200px;
            border:none;
            border-radius:10px;
            font-size:16px;
            margin-right:10px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:10px;
            background:cyan;
            color:black;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            font-weight:bold;
        }

        button:hover{
            transform:scale(1.05);
            background:white;
            box-shadow:0 0 15px cyan;
        }

        .question{
            background:rgba(255,255,255,0.08);
            padding:20px;
            margin-bottom:20px;
            border-radius:15px;
            border:1px solid rgba(0,255,255,0.2);
            transition:0.3s;
        }

        .question:hover{
            transform:translateY(-3px);
            box-shadow:0 0 15px rgba(0,255,255,0.3);
        }

        .question b{
            color:cyan;
            font-size:20px;
        }

        label{
            display:block;
            margin-top:10px;
            padding:8px;
            border-radius:8px;
            transition:0.2s;
        }

        label:hover{
            background:rgba(0,255,255,0.1);
        }

        #result{
            margin-top:30px;
            background:rgba(255,255,255,0.08);
            padding:20px;
            border-radius:15px;
            line-height:1.8;
        }

        h3{
            color:cyan;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

    <h1>⚡ Shadow Math Quiz ⚡</h1>

    <div class="container">

        <div id="ageSection">

            <h2 style="margin-bottom:20px;">Enter Your Age</h2>

            <input type="number" id="age" placeholder="Age">

            <button onclick="startQuiz()">Start Quiz</button>

        </div>

        <form id="quizForm"></form>

        <div id="result"></div>

    </div>

    <script>

        let questions = [];

        function getRange(age) {

            if (age <= 7) return 10;
            if (age <= 10) return 20;
            if (age <= 13) return 50;

            return 100;
        }

        function randomOp() {

            let ops = ['+', '-', '*', '/'];

            return ops[Math.floor(Math.random() * ops.length)];
        }

        function generateQuestion(range) {

            let a, b, op, answer;

            while (true) {

                a = Math.floor(Math.random() * range) + 1;
                b = Math.floor(Math.random() * range) + 1;
                op = randomOp();

                if (op === '+') {

                    answer = a + b;
                    break;
                }

                if (op === '-') {

                    if (a >= b) {

                        answer = a - b;
                        break;
                    }
                }

                if (op === '*') {

                    answer = a * b;
                    break;
                }

                if (op === '/') {

                    a = a * b;
                    answer = a / b;
                    break;
                }
            }

            return {
                q: `${a} ${op} ${b}`,
                ans: answer
            };
        }

        function startQuiz() {

            let age = document.getElementById("age").value;

            if (age === "") {

                alert("Please Enter Age");
                return;
            }

            let range = getRange(age);

            document.getElementById("ageSection").style.display = "none";

            let form = document.getElementById("quizForm");

            form.innerHTML = "";

            questions = [];

            for (let i = 0; i < 20; i++) {

                let q = generateQuestion(range);

                questions.push(q);

                let div = document.createElement("div");

                div.className = "question";

                let options = [q.ans];

                while (options.length < 4) {

                    let fake = q.ans + Math.floor(Math.random() * 10) - 5;

                    if (fake >= 0 && !options.includes(fake)) {

                        options.push(fake);
                    }
                }

                options.sort(() => Math.random() - 0.5);

                div.innerHTML = `
                    <b>Q${i+1}: ${q.q}</b><br><br>

                    ${options.map(opt =>

                        `<label>
                            <input type="radio" name="q${i}" value="${opt}">
                            ${opt}
                        </label>`

                    ).join("")}
                `;

                form.appendChild(div);
            }

            let submitBtn = document.createElement("button");

            submitBtn.type = "button";

            submitBtn.innerText = "Submit Quiz";

            submitBtn.onclick = checkAnswers;

            form.appendChild(submitBtn);
        }

        function checkAnswers() {

            let correct = 0;
            let wrong = 0;
            let review = "";

            for (let i = 0; i < questions.length; i++) {

                let selected =
                document.querySelector(`input[name="q${i}"]:checked`);

                if (selected &&
                    Number(selected.value) === questions[i].ans) {

                    correct++;
                }

                else {

                    wrong++;

                    review +=
                    `Q${i+1}: ${questions[i].q} = ${questions[i].ans}<br>`;
                }
            }

            document.getElementById("result").innerHTML = `

                <h3>Quiz Result</h3>

                ✅ Correct Answers: ${correct}<br>

                ❌ Wrong Answers: ${wrong}<br><br>

                <b>Correct Solutions:</b><br><br>

                ${review}
            `;
        }

    </script>

</body>

</html>
